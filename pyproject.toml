[project]
name = "quiver-appimage-manager"
version = "0.3.0"
description = "quiver - AppImage manager: CLI + interactive OpenTUI console (Linux TUI), upstream updates, desktop integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.scripts]
quiver = "quiver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiver"]

# Ship the compiled OpenTUI frontend inside the Python package (Linux x64).
# Build it first with scripts/build-tui.sh (requires Bun); the wheel build
# skips it silently when absent (e.g. on non-Linux dev machines).
[tool.hatch.build.targets.wheel.force-include]
"tui/dist/quiver-tui" = "quiver/bin/quiver-tui"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tui/src", "tui/scripts", "tui/package.json", "tui/tsconfig.json", "scripts", "README.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
files = ["src/quiver"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
